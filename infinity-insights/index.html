<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Infinity Insights | Maths Assoc BITS Pilani</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/scripts/tailwind-config.js"></script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Libre+Franklin:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/styles/styles.css" />
    <!-- Favicons -->
    <link
      rel="icon"
      type="image/png"
      href="/favicon/favicon-96x96-2.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon-2.ico" />
    <link
      rel="apple-touch-icon-2"
      sizes="180x180"
      href="/favicon/apple-touch-icon-2.png"
    />
    <link rel="manifest" href="/favicon/site.webmanifest" />
  </head>

  <body
    class="!bg-gray-50 dark:!bg-gray-950 text-gray-900 dark:text-gray-100 transition-colors duration-300 font-serif antialiased selection:bg-gray-200 dark:selection:bg-gray-800 min-h-screen flex flex-col"
  >
    <!-- Navbar -->
    <div
      class="site-header sticky top-0 z-50 bg-gray-50/90 dark:bg-gray-950/90 border-b border-gray-200 dark:border-gray-800"
    >
      <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-20">
          <!-- Logo / Brand -->
          <div class="flex items-center gap-4">
            <div class="shrink-0">
              <img
                src="/assets/massocicon.jpg"
                alt="Logo"
                class="h-10 w-10 rounded-full"
              />
            </div>
            <div class="flex flex-col leading-none">
              <a
                href="/infinity-insights/index.html"
                class="brand__name text-indigo dark:text-lilac hover:text-violet transition-colors font-sans"
              >
                Infinity Insights
              </a>
              <span
                class="brand__sub mt-1 text-gray-500 dark:text-gray-400 font-sans"
                >Maths Assoc BITS Pilani</span
              >
            </div>
          </div>

          <!-- Desktop Menu -->
          <div
            class="site-nav hidden md:flex items-center space-x-8 font-sans text-gray-700 dark:text-gray-300"
          >
            <!-- Live event: remove when Sherlock vs Moriarty ends -->
            <a href="https://svm.mathbitsp.com" class="live-pill"
              ><span class="live-pill__dot" aria-hidden="true"></span>Live: Sherlock vs Moriarty</a
            >
            <a href="/index.html" class="hover:text-violet dark:hover:text-lilac transition-colors"
              >Home</a
            >
            <a
              href="/infinity-insights/write.html"
              class="hover:text-violet dark:hover:text-lilac transition-colors"
              >Write</a
            >

            <!-- Theme Toggle -->
            <button
              id="theme-toggle"
              class="focus:outline-none hover:text-violet dark:hover:text-lilac transition-colors"
            >
              <svg
                id="theme-toggle-light-icon"
                class="hidden w-5 h-5"
                fill="currentColor"
                viewBox="0 0 20 20"
              >
                <path
                  d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"
                  fill-rule="evenodd"
                  clip-rule="evenodd"
                ></path>
              </svg>
              <svg
                id="theme-toggle-dark-icon"
                class="hidden w-5 h-5"
                fill="currentColor"
                viewBox="0 0 20 20"
              >
                <path
                  d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"
                ></path>
              </svg>
            </button>
          </div>

          <!-- Mobile Menu Button -->
          <div class="md:hidden">
            <button
              id="menu-toggle"
              class="text-2xl hover:text-violet dark:hover:text-lilac transition-colors"
            >
              &#9776;
            </button>
          </div>
        </div>
      </nav>
    </div>

    <!-- Mobile Menu Overlay -->
    <div
      id="menu"
      class="fixed top-0 left-0 w-screen h-screen bg-navy/[0.97] text-white z-[100] transform translate-x-full transition-transform duration-300 md:hidden flex flex-col justify-center items-center space-y-8 font-sans text-2xl uppercase tracking-widest"
    >
      <button
        id="close-menu"
        class="absolute top-6 right-6 text-4xl hover:text-lilac"
      >
        &times;
      </button>
      <!-- Live event: remove when Sherlock vs Moriarty ends -->
      <a href="https://svm.mathbitsp.com" class="live-pill live-pill--menu"
        ><span class="live-pill__dot" aria-hidden="true"></span>Live: Sherlock vs Moriarty</a
      >
      <a href="/index.html" class="hover:text-lilac">Home</a>
      <a href="/infinity-insights/index.html" class="hover:text-lilac"
        >Blog</a
      >
      <a href="/infinity-insights/write.html" class="hover:text-lilac"
        >Write</a
      >
    </div>

    <!-- Main Content -->
    <main
      class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 lg:py-16 flex-grow"
    >
      <!-- Highlighted Article (Hero) -->
      <section
        id="hero-article"
        class="mb-20 border-b border-gray-200 dark:border-gray-800 pb-16 hidden"
      ></section>

      <!-- Articles Grid -->
      <section>
        <div class="flex items-center justify-between mb-12">
          <h2
            class="text-2xl font-bold border-l-4 border-black dark:border-white pl-4"
          >
            Latest Insights
          </h2>
        </div>

        <div
          id="articles-grid"
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-0 gap-y-16"
        >
          <!-- Loading State - Will be replaced by JS -->
          <div class="col-span-full text-center py-12">
            <div
              class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-gray-900 dark:border-gray-100"
            ></div>
            <p class="mt-4 text-gray-500">Loading articles...</p>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer relative z-10">
      <div class="max-w-[1180px] mx-auto">
        <div class="flex flex-wrap justify-between items-center gap-6">
          <a href="/index.html" class="flex items-center gap-3.5">
            <img src="/assets/massocicon.jpg" alt="Logo" class="h-11 w-11 rounded-full" />
            <span class="flex flex-col gap-1 leading-tight">
              <span class="brand__name text-white !font-semibold">Mathematics Association</span>
              <span class="text-xs text-[#8f8cab]">BITS Pilani, Pilani Campus</span>
            </span>
          </a>
          <div class="footer__links flex flex-wrap gap-x-8 gap-y-3 text-[13px]">
            <a href="/puzzles/index.html">Puzzles</a>
            <a href="/infinity-insights/index.html">Blog</a>
            <a href="/about.html">About</a>
            <a href="#">Instagram</a>
            <a href="#">LinkedIn</a>
          </div>
        </div>
        <div class="footer__bottom mt-8 pt-5 uppercase">
          &copy; 2026 Mathematics Association &middot; BITS Pilani
        </div>
      </div>
    </footer>

    <script src="/scripts/darkMode.js"></script>
    <script src="/scripts/config.js"></script>
    <script src="/scripts/nav.js"></script>
    <script src="/scripts/articles.js"></script>
  </body>
</html>
