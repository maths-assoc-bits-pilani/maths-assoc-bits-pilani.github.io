<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Maths Assoc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: "class" };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Merriweather:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Lato', sans-serif; }
        h1, h2, h3 { font-family: 'Merriweather', serif; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-black text-gray-900 dark:text-gray-100 transition-colors duration-300">

    <div class="max-w-6xl mx-auto px-4 py-12">
        <div class="flex justify-between items-center mb-12">
            <h1 class="text-4xl font-extrabold">Admin Dashboard</h1>
            <a href="/" class="text-sm font-bold uppercase tracking-widest hover:text-sky-500">Back to Home</a>
        </div>

        <!-- Auth Section -->
        <div id="auth-section" class="max-w-md mx-auto bg-white dark:bg-gray-900 p-8 rounded-lg shadow-lg">
            <h2 class="text-2xl font-bold mb-6">Admin Login</h2>
            <input type="password" id="admin-key" placeholder="Enter Admin Secret Key" 
                class="w-full p-3 mb-4 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded focus:outline-none focus:border-sky-500">
            <button onclick="loadDashboard()" class="w-full bg-black dark:bg-white text-white dark:text-black font-bold py-3 rounded hover:opacity-80 transition">
                Access Dashboard
            </button>
        </div>

        <!-- Dashboard Content (Hidden by default) -->
        <div id="dashboard-content" class="hidden">
            <!-- Tabs -->
            <div class="flex gap-4 mb-6 border-b border-gray-200 dark:border-gray-800">
                <button id="tab-pending" onclick="switchTab('pending')" class="pb-3 px-2 font-bold border-b-2 border-black dark:border-white">Pending Articles</button>
                <button id="tab-published" onclick="switchTab('published')" class="pb-3 px-2 font-bold border-b-2 border-transparent text-gray-500 hover:text-gray-700">Published Articles</button>
            </div>

            <!-- Pending Articles Section -->
            <div id="pending-section">
                <div id="pending-list" class="grid gap-6">
                    <p class="text-gray-500 italic">Loading pending articles...</p>
                </div>
            </div>

            <!-- Published Articles Section -->
            <div id="published-section" class="hidden">
                <div id="published-list" class="grid gap-6">
                    <p class="text-gray-500 italic">Loading published articles...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="/scripts/config.js"></script>
    <script src="/scripts/admin.js"></script>
</body>
</html>
