<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Maths Assoc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: "class" };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Merriweather:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Lato', sans-serif; }
        h1, h2, h3 { font-family: 'Merriweather', serif; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-black text-gray-900 dark:text-gray-100 transition-colors duration-300">

    <div class="max-w-6xl mx-auto px-4 py-12">
        <div class="flex justify-between items-center mb-12">
            <h1 class="text-4xl font-extrabold">Admin Dashboard</h1>
            <a href="/" class="text-sm font-bold uppercase tracking-widest hover:text-sky-500">Back to Home</a>
        </div>

        <!-- Auth Section -->
        <div id="auth-section" class="max-w-md mx-auto bg-white dark:bg-gray-900 p-8 rounded-lg shadow-lg">
            <h2 class="text-2xl font-bold mb-6">Admin Login</h2>
            <input type="password" id="admin-key" placeholder="Enter Admin Secret Key" 
                class="w-full p-3 mb-4 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded focus:outline-none focus:border-sky-500">
            <button onclick="loadDashboard()" class="w-full bg-black dark:bg-white text-white dark:text-black font-bold py-3 rounded hover:opacity-80 transition">
                Access Dashboard
            </button>
        </div>

        <!-- Dashboard Content (Hidden by default) -->
        <div id="dashboard-content" class="hidden">
            <!-- Tabs -->
            <div class="flex gap-4 mb-6 border-b border-gray-200 dark:border-gray-800 overflow-x-auto">
                <button id="tab-pending" onclick="switchTab('pending')" class="pb-3 px-2 font-bold border-b-2 border-black dark:border-white whitespace-nowrap">Pending Articles</button>
                <button id="tab-published" onclick="switchTab('published')" class="pb-3 px-2 font-bold border-b-2 border-transparent text-gray-500 hover:text-gray-700 whitespace-nowrap">Published Articles</button>
                <button id="tab-puzzles" onclick="switchTab('puzzles')" class="pb-3 px-2 font-bold border-b-2 border-transparent text-gray-500 hover:text-gray-700 whitespace-nowrap">Weekly Puzzles</button>
            </div>

            <!-- Pending Articles Section -->
            <div id="pending-section">
                <div id="pending-list" class="grid gap-6">
                    <p class="text-gray-500 italic">Loading pending articles...</p>
                </div>
            </div>

            <!-- Published Articles Section -->
            <div id="published-section" class="hidden">
                <div id="published-list" class="grid gap-6">
                    <p class="text-gray-500 italic">Loading published articles...</p>
                </div>
            </div>

            <!-- Puzzles Section -->
            <div id="puzzles-section" class="hidden">
                <div class="mb-6 flex justify-between items-center">
                    <h2 class="text-2xl font-bold">Weekly Puzzles</h2>
                    <button onclick="togglePuzzleForm()" class="bg-black dark:bg-white text-white dark:text-black px-4 py-2 rounded font-bold hover:opacity-80 transition">
                        + Add New Puzzle
                    </button>
                </div>

                <!-- Add/Edit Puzzle Form (Hidden by default) -->
                <div id="puzzle-form-container" class="hidden bg-white dark:bg-gray-900 p-6 rounded-lg shadow-md border border-gray-200 dark:border-gray-800 mb-8">
                    <h3 id="puzzle-form-title" class="text-xl font-bold mb-4">Add New Puzzle</h3>
                    <form id="puzzle-form" onsubmit="submitPuzzleForm(event)">
                        <input type="hidden" id="puzzle-mode" value="add">
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                            <div>
                                <label class="block text-sm font-bold mb-1">Week Number</label>
                                <input type="number" id="puzzle-week" required class="w-full p-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded">
                            </div>
                            <div>
                                <label class="block text-sm font-bold mb-1">Goes Live At</label>
                                <input type="datetime-local" id="puzzle-live-at" required class="w-full p-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="block text-sm font-bold mb-1">Question HTML</label>
                            <textarea id="puzzle-question-html" rows="3" required class="w-full p-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded"></textarea>
                        </div>
                        
                        <div class="mb-4">
                            <label class="block text-sm font-bold mb-1">Question Image URL (Optional)</label>
                            <input type="url" id="puzzle-question-image" class="w-full p-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded">
                        </div>

                        <div class="mb-4">
                            <label class="block text-sm font-bold mb-1">Correct Answer (Exact Match)</label>
                            <input type="text" id="puzzle-answer" required class="w-full p-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded">
                        </div>

                        <div class="mb-4">
                            <label class="block text-sm font-bold mb-1">Hints (JSON Array of strings, e.g. ["Hint 1", "Hint 2"])</label>
                            <input type="text" id="puzzle-hints" value="[]" class="w-full p-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded font-mono text-sm">
                        </div>
                        
                        <div class="mb-4">
                            <label class="block text-sm font-bold mb-1">Solution HTML</label>
                            <textarea id="puzzle-solution-html" rows="3" required class="w-full p-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded"></textarea>
                        </div>
                        
                        <div class="mb-4">
                            <label class="block text-sm font-bold mb-1">Solution Image URL (Optional)</label>
                            <input type="url" id="puzzle-solution-image" class="w-full p-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded">
                        </div>

                        <div class="mb-6 flex items-center">
                            <input type="checkbox" id="puzzle-active" checked class="mr-2">
                            <label for="puzzle-active" class="text-sm font-bold">Is Active</label>
                        </div>

                        <div class="flex gap-4">
                            <button type="button" onclick="togglePuzzleForm()" class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded hover:bg-gray-50 dark:hover:bg-gray-800">Cancel</button>
                            <button type="submit" class="bg-black dark:bg-white text-white dark:text-black px-6 py-2 rounded font-bold hover:opacity-80 transition">Save Puzzle</button>
                        </div>
                    </form>
                </div>

                <div id="puzzles-list" class="grid gap-6">
                    <p class="text-gray-500 italic">Loading puzzles...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="/scripts/config.js"></script>
    <script src="/scripts/admin.js"></script>
</body>
</html>
